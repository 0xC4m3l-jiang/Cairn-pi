name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (vitest run)
        run: |
          set +e
          npm test 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 把失败摘要发成 annotation：公开仓库的 check-run annotations 可匿名读取
            pattern='FAIL|AssertionError|Error:|expected|actual|Timed out'
            pattern="$pattern|Cannot|not a function|undefined"
            grep -nE "$pattern" /tmp/test.log \
              | head -12 \
              | while IFS= read -r line; do
                  echo "::error title=vitest::$line"
                done
            echo "::error title=exit code::npm test 退出码 $code"
            exit "$code"
          fi
